<!doctype html>
<html ng-app="MainApp">
<head>
  <meta charset="utf-8">
  <title>Administración Tienda - Camisetas</title>

  <link rel="stylesheet"
        href="//netdna.bootstrapcdn.com/bootstrap/3.0.0/css/bootstrap.min.css">

  <script src="//ajax.googleapis.com/ajax/libs/angularjs/1.8.2/angular.min.js"></script>
  <script src="core.js"></script>
</head>

<body ng-controller="mainController">
<div class="container">

  <div class="jumbotron text-center">
    <h1>Gestión de Camisetas</h1>
    <h3>Total: {{ camisetas.length }}</h3>
  </div>

  <div class="row">

    <!-- TABLA -->
    <div class="col-sm-7">
      <table class="table table-striped table-bordered">
        <tr class="info">
          <th>Modelo</th>
          <th>Color</th>
          <th>Material</th>
          <th>Cantidad</th>
          <th>Precio</th>
        </tr>

        <tr ng-repeat="c in camisetas"
            ng-click="selectCamiseta(c)"
            style="cursor:pointer">
          <td>{{ c.modelo }}</td>
          <td>{{ c.color }}</td>
          <td>{{ c.material }}</td>
          <td>{{ c.cantidad }}</td>
          <td>{{ c.precio }} €</td>
        </tr>
      </table>
    </div>

    <!-- FORMULARIO -->
    <div class="col-sm-5">

      <form name="myForm" ng-submit="$event.preventDefault()">

        <select class="form-control"
                ng-model="newCamiseta.modelo"
                required>
          <option value="">Modelo</option>
          <option>BASICA</option>
          <option>OVERSIZE</option>
          <option>POLO</option>
        </select>
        <br>

        <select class="form-control"
                ng-model="newCamiseta.color"
                required>
          <option value="">Color</option>
          <option>NEGRO</option>
          <option>BLANCO</option>
          <option>ROJO</option>
          <option>AZUL</option>
          <option>VERDE</option>
        </select>
        <br>

        <select class="form-control"
                ng-model="newCamiseta.material"
                required>
          <option value="">Material</option>
          <option>ALGODON</option>
          <option>POLIESTER</option>
          <option>SEDA</option>
        </select>
        <br>

        <input type="number"
               class="form-control"
               placeholder="Cantidad"
               ng-model="newCamiseta.cantidad"
               min="0"
               required>
        <br>

        <input type="number"
               class="form-control"
               placeholder="Precio"
               ng-model="newCamiseta.precio"
               min="0"
               step="0.01"
               required>
        <br>

        <button type="button"
                class="btn btn-success"
                ng-click="registrarCamiseta()"
                ng-disabled="myForm.$invalid || selected">
          Crear
        </button>

        <button type="button"
                class="btn btn-warning"
                ng-click="modificarCamiseta(newCamiseta)"
                ng-disabled="myForm.$invalid || !selected">
          Modificar
        </button>

        <button type="button"
                class="btn btn-danger"
                ng-click="borrarCamiseta(newCamiseta)"
                ng-disabled="!selected">
          Eliminar
        </button>

      </form>

    </div>

  </div>

</div>
</body>
</html>
